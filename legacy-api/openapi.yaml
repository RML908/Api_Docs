openapi: 3.1.0
info:
  title: Hospital Scheduling API (Test Environment)
  version: "1.0.0"
  description: >
    Isolated test environment for the hospital patient scheduling endpoints.
    Uses a single shared test database; safe to test freely without affecting
    production data. hospital_id routing has been removed for this test
    deployment.
servers:
  - url: https://dstapidocs.space/legacy-api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
paths:
  /set_patient_schedule:
    post:
      summary: Create Patient Schedule
      description: >
        Registers a new patient visit/appointment. The visit is created with status Pending.
        visit_id (visit number), visit_date_end (visit_date + visit_duration minutes), the video
        consultation link, doctor_id (looked up from doctor_ssn among enabled doctors, otherwise 0)
        and the branch name (looked up from branch_office_id) are generated by the API.
        Services are saved as a list in the visit's service list. Send fields as
        application/x-www-form-urlencoded.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [visit_date, patient_ssn, patient_name, patient_surname, patient_phone_mobile, department_id, doctor_ssn]
              properties:
                visit_date:
                  type: string
                  description: "Visit start, format YYYY-MM-DD HH:MM:SS"
                  example: "2026-07-01 10:00:00"
                visit_duration:
                  type: string
                  description: "Visit length in minutes (default 30)"
                  example: "30"
                type_of_visit_id:
                  type: string
                  description: "Visit type: 1 = Consultation (default), 3 = Diagnostic, 5 = Equipment supply"
                  example: "1"
                type_of_visit:
                  type: string
                patient_ssn:
                  type: string
                patient_document:
                  type: string
                patient_name:
                  type: string
                patient_surname:
                  type: string
                patient_middlename:
                  type: string
                patient_birthday:
                  type: string
                  description: "Format YYYY-MM-DD"
                  example: "1990-01-01"
                patient_gender:
                  type: string
                patient_phone_mobile:
                  type: string
                patient_mail:
                  type: string
                complaints:
                  type: string
                insurance_id:
                  type: string
                insurance_name:
                  type: string
                insurance_policy_no:
                  type: string
                department_id:
                  type: string
                department_name:
                  type: string
                doctor_ssn:
                  type: string
                doctor_name:
                  type: string
                note:
                  type: string
                have_a_referral:
                  type: string
                  example: "0"
                payment_type_id:
                  type: string
                  description: "Payment type id (default 3). 1 = State order, 2 = Insurance (Social package), 3 = Paid, 4 = Insurance, 5 = Card turnover, 6 = Donor, 7 = Universal insurance, 8 = Motor insurance (MTPL), 9 = Administration"
                  example: "3"
                branch_office_id:
                  type: string
                  description: id from GET /get_branch; the branch name is looked up and stored automatically
                  example: "1"
                services:
                  type: string
                  description: 'JSON array of {service_id, service_name} objects, service_id from GET /get_hospital_services (service_local_id)'
                  example: '[{"service_id":"130137","service_name":"Genioplasty"}]'
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status: { type: string, example: "1" }
                    message: { type: string, example: "Registration Successfully" }
                    row_id: { type: integer, example: 1 }
                    branch_office_id: { type: string, example: "1" }
                    branch_office: { type: string, example: "DST Բժշկական համալիր" }
        "403":
          description: 'Validation failure or DB error. Body: [{"status":"0","message":"..."}]. A wrong or missing Bearer token returns the plain text "Access denied..."'

  /set_patient_schedule_update:
    post:
      summary: Update Patient Schedule Visit Date
      description: >
        Reschedules an existing patient visit (schedule_id is the row_id returned by
        POST /set_patient_schedule). The visit status is reset to Pending and the queue
        confirmation is cleared. Visit statuses: Pending (new or rescheduled), Canceled.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [schedule_id, visit_date]
              properties:
                schedule_id:
                  type: string
                  example: "1"
                visit_date:
                  type: string
                  example: "2026-07-02 11:00:00"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status: { type: string, example: "1" }
                    message: { type: string, example: "The queue has been successfully edited" }
        "403":
          description: Validation failure or DB error

  /set_patient_schedule_cancel:
    post:
      summary: Cancel Patient Schedule
      description: >
        Cancels an existing patient visit (schedule_id is the row_id returned by
        POST /set_patient_schedule). The visit status becomes Canceled and cancelled_date and
        cancelled_by are saved. Dates use the format YYYY-MM-DD HH:MM:SS.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [schedule_id, cancelled_by, cancelled_date]
              properties:
                schedule_id:
                  type: string
                  example: "1"
                cancelled_by:
                  type: string
                  example: "1"
                cancelled_date:
                  type: string
                  example: "2026-07-01 09:00:00"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status: { type: string, example: "1" }
                    message: { type: string, example: "Queue canceled successfully" }
                    schedule_id: { type: string, example: "1" }
        "403":
          description: Validation failure or DB error

  /set_doctor_block_time:
    post:
      summary: Block Doctor Time Slot
      description: >
        Creates a blocked time entry for a doctor (e.g. vacation, unavailability).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [doctor_ssn, block_start, block_end]
              properties:
                doctor_id:
                  type: string
                  description: "Optional. If omitted, it is looked up from doctor_ssn (0 if the doctor is not found)"
                doctor_ssn:
                  type: string
                  example: "0001"
                block_start:
                  type: string
                  example: "2026-08-01 09:00:00"
                block_end:
                  type: string
                  example: "2026-08-01 12:00:00"
                note:
                  type: string
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status: { type: string, example: "1" }
                    id: { type: integer, example: 1 }
                    message: { type: string, example: "The data has been created successfully" }
        "403":
          description: Validation failure or DB error

  /get_doctor_block_time:
    get:
      summary: Get Doctor Blocked Time & Appointments
      description: >
        Returns a doctor's upcoming blocked time slots and active appointments
        combined (excludes completed/cancelled visits and hidden blocks),
        useful for checking availability.
      parameters:
        - name: doctor_ssn
          in: query
          required: true
          schema: { type: string, example: "0001" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 1 }
                    doctor_ssn: { type: string, example: "0001" }
                    block_start: { type: string, example: "2026-08-01 09:00:00" }
                    block_end: { type: string, example: "2026-08-01 12:00:00" }
                    type: { type: string, enum: [block, appointment], example: "block" }

  /get_branch:
    get:
      summary: Get Branch List
      description: >
        Returns active hospital branches/offices. Omit id to get the full
        list, or pass it to fetch a single branch. Use the returned id as
        branch_office_id when calling POST /set_patient_schedule.
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: integer, example: 1 }
          description: Optional — filters to a single branch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 1 }
                    code: { type: integer, example: 1 }
                    text_am: { type: string, example: "DST Բժշկական համալիր" }
                    text_en: { type: string }
                    text_ru: { type: string }
                    letter: { type: string, example: "G" }
                    address: { type: string, example: "Սաղավանյան 76" }
                    phone: { type: string, example: "010342058" }
                    gps_location: { type: string, example: "40.21025164520757, 44.4390024727424" }
                    medcard: { type: integer, example: 1 }
                    hospital_id: { type: integer, example: 0 }
                    mail: { type: string }
                    discount_lab: { type: number, example: 0 }
                    discount_clinic: { type: number, example: 0 }

  /get_hospital_doctors:
    get:
      summary: Get Hospital Doctors
      description: >
        Returns doctors available for mobile booking (access_of_mobile = 1,
        enabled = 1), including their default consultation/telemed service
        prices resolved via structure_hospital_services.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 1 }
                    user_id: { type: string, example: "1" }
                    user_document: { type: string }
                    user_ssn: { type: string, example: "0001" }
                    user_name: { type: string, example: "Test" }
                    user_surname: { type: string, example: "Doctor" }
                    user_middlename: { type: string }
                    user_birthday: { type: string, example: "1980-01-01 00:00:00" }
                    user_gender: { type: string, example: "M" }
                    user_phone: { type: string, example: "+37499000000" }
                    user_mail: { type: string, example: "doctor@example.com" }
                    department_name_id: { type: integer, example: 1 }
                    department_name: { type: string, example: "General" }
                    cabinet: { type: string, example: "101" }
                    profession_id: { type: integer, example: 1 }
                    profession: { type: string, example: "General Practitioner" }
                    position: { type: string, example: "Doctor" }
                    academic_degree: { type: string, example: "MD" }
                    rating: { type: integer, example: 0 }
                    rating_dislike: { type: integer, example: 0 }
                    branch_id: { type: integer, example: 1 }
                    branch_office: { type: string, example: "DST Բժշկական համալիր" }
                    defoult_cons_price: { type: number, example: 5000 }
                    defoult_telemed_cons_price: { type: number, example: 4000 }
                    teleconsultation_enabled: { type: integer, example: 1 }
                    about_us: { type: string }
                    user_image: { type: string, description: "base64-encoded image, empty string if none" }

  /get_hospital_services:
    get:
      summary: Get Hospital Services
      description: Returns active/enabled hospital services, optionally filtered by department.
      parameters:
        - name: department_id
          in: query
          required: false
          schema: { type: integer, example: 1 }
          description: Optional — filters to a single department's services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 1 }
                    department_id: { type: integer, example: 1 }
                    service_local_id: { type: string, example: "S001" }
                    service_name: { type: string, example: "General Consultation" }
                    service_price: { type: number, example: 5000 }

  /get_hospital_departments:
    get:
      summary: Get Hospital Departments
      description: >
        Returns visible departments/specializations available for the
        medcard system (visible = 1, medcard = 1).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 1 }
                    global_service_code: { type: string, example: "GS001" }
                    global_service: { type: string, example: "General Medicine" }
                    department_id: { type: integer, example: 1 }
                    department_name_am: { type: string }
                    department_name_en: { type: string, example: "General Medicine" }
                    department_name_ru: { type: string }
                    department_specialization_id: { type: integer, example: 1 }
                    department_specialization: { type: string, example: "General Practice" }
                    is_tool: { type: integer, example: 0 }
                    branch_id: { type: integer, example: 1 }
                    branch_name: { type: string, example: "DST Բժշկական համալիր" }
                    queuing: { type: integer, example: 1 }
                    location: { type: string, example: "Floor 1" }
                    registration_location: { type: string, example: "Reception Desk 1" }

  /get_hospital_doctor_work_time:
    get:
      summary: Get Doctor Work Schedule
      description: >
        Returns doctors' weekly work schedules: working days, work hours,
        break, admission duration, and the telemedicine / state / VIP time
        windows. Omit doctor_ssn to get all schedules.
      parameters:
        - name: doctor_ssn
          in: query
          required: false
          description: Optional — filters to a single doctor
          schema: { type: string, example: "0001" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 1 }
                    doctor_id: { type: string, example: "1" }
                    doctor_ssn: { type: string, example: "0001" }
                    days_of_the_week: { type: string, example: "1,2,3,4,5" }
                    work_start: { type: string, example: "09:00:00" }
                    work_end: { type: string, example: "18:00:00" }
                    break_start: { type: string, example: "13:00:00" }
                    break_duration: { type: integer, example: 60 }
                    duration_of_admission: { type: integer, example: 30 }
                    telemed_start: { type: string, example: "16:00:00" }
                    telemed_end: { type: string, example: "18:00:00" }
                    state_start: { type: string, example: "09:00:00" }
                    state_end: { type: string, example: "13:00:00" }
                    vip_start: { type: string, example: "14:00:00" }
                    vip_end: { type: string, example: "16:00:00" }
