version: "3.9"

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dst_api_docs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dst_api_docs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dst_api_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dst_api_docs_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-dst_api_docs}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: dst_api_docs_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ─── Legacy API test DB (MySQL) ─────────────────────────────────────────────
  mysql_legacy:
    image: mysql:8.0
    container_name: dst_mysql_legacy
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_PASSWORD:-changeme}
      MYSQL_DATABASE: legacy_test
      MYSQL_USER: legacy_test
      MYSQL_PASSWORD: ${LEGACY_DB_PASSWORD:-changeme}
    volumes:
      - mysql_legacy_data:/var/lib/mysql
      - ./legacy-api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${LEGACY_DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Legacy API (PHP test scripts) ──────────────────────────────────────────
  legacy-api:
    build:
      context: ./legacy-api
      dockerfile: Dockerfile
    container_name: dst_legacy_api
    restart: unless-stopped
    depends_on:
      mysql_legacy:
        condition: service_healthy
    environment:
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-changeme}

volumes:
  postgres_data:
    driver: local
  mysql_legacy_data:
    driver: local

networks:
  default:
    name: dst_api_docs_network
