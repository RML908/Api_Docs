# Redirect dstapidocs.space to HTTPS; leave other hosts (temp URL, other domains) on HTTP.
server {
    listen 80;
    server_name dstapidocs.space www.dstapidocs.space;
    return 301 https://dstapidocs.space$request_uri;
}

server {
    listen 443 ssl;
    server_name dstapidocs.space www.dstapidocs.space;

    ssl_certificate     /etc/letsencrypt/live/dstapidocs.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dstapidocs.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Default server: handles all other hosts (DBM temp URL, dstapidocs.net, etc.) over plain HTTP.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
